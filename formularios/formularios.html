<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <form> <!-- Estrutura do formulário -->

        <label for="nome">Nome:</label>
        <input type="text" name="nome" placeholder="Informe seu nome">

        <label for="email">E-mail:</label>
        <input type="email" name="email" placeholder="Informe seu email">

        <label for="data">Data:</label>
        <input type="date" name="data">

        <label for="senha">Senha:</label>
        <input type="password" name="senha" placeholder="Informe sua senha">

        <label for="idade">Idade:</label>
        <input type="number" name="idade" placeholder="Informe sua idade" required>

        <button type="submit">Enviar:</button>

    </form>    
    
</body>
</html>
